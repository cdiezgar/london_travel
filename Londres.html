<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expedición a Londres 2026</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Homemade+Apple&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen flex flex-col overflow-hidden text-base">

    <header class="fixed top-0 w-full z-50 p-4 flex justify-between items-center pointer-events-none">
        <div class="magic-font text-[var(--gryffindor-red)] font-bold text-lg bg-white/40 backdrop-blur-sm px-3 py-1 rounded-lg border border-[var(--gold)]/30 pointer-events-auto">
            LND 2026
        </div>
        <button onclick="logout()" id="global-logout" class="hidden pointer-events-auto bg-white/60 backdrop-blur-md text-[var(--gryffindor-red)] w-10 h-10 rounded-full shadow-lg border border-[var(--gold)] flex items-center justify-center active:scale-95 transition-all">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </header>
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-32 relative scroll-smooth overscroll-contain">
        </main>

    <nav id="bottom-nav" class="bottom-nav fixed bottom-0 w-full flex justify-around items-center pt-3 pb-3 sm:pb-3 text-gray-400 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)]">
        
        <button onclick="renderHome()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-home">
            <i class="fas fa-hat-wizard text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Inicio</span>
        </button>

        <button onclick="renderItineraryList()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-itin">
            <i class="fas fa-scroll text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Diario</span>
        </button>

        <button onclick="renderTransport()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-trans">
            <i class="fas fa-train-subway text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Viaje</span>
        </button>

        <button onclick="renderFood()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-food">
            <i class="fas fa-utensils text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Comer</span>
        </button>

        <button onclick="renderExplorerPass()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-pass">
            <i class="fas fa-ticket-alt text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Pase</span>
        </button>

        <button onclick="renderExtras()" class="nav-item flex flex-col items-center w-1/6 focus:outline-none" id="nav-extra">
            <i class="fas fa-bolt text-xl mb-1"></i>
            <span class="text-[10px] magic-font tracking-wide">Secretos</span>
        </button>

    </nav>
    <script type="module" src="app.js"></script>
</body>
</html>
