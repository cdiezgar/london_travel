<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expedición a Londres 2026</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Homemade+Apple&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="h-screen flex flex-col overflow-hidden text-base">

    <header class="fixed top-0 w-full z-50 p-4 flex justify-between items-center pointer-events-none">
        <button onclick="toggleMenu()" id="hamburger-btn"
            class="hidden pointer-events-auto bg-[#2b1b17] text-[var(--gold)] w-10 h-10 rounded-lg shadow-lg border border-[var(--gold)] flex items-center justify-center active:scale-95 transition-all">
            <i class="fas fa-bars text-xl"></i>
        </button>

        <div
            class="magic-font text-[var(--gryffindor-red)] font-bold text-lg bg-white/40 backdrop-blur-sm px-3 py-1 rounded-lg border border-[var(--gold)]/30 pointer-events-auto absolute left-1/2 transform -translate-x-1/2">
            El Andén 9 ¾
        </div>

        <div id="header-actions" class="hidden pointer-events-auto flex items-center gap-2">
            <button onclick="backToTrips()"
                class="hidden md:flex bg-white/80 backdrop-blur-md text-[var(--ink)] w-10 h-10 rounded-full shadow-lg border border-[var(--gold)] items-center justify-center active:scale-95 transition-all"
                title="Mis Viajes">
                <i class="fas fa-map-marked-alt"></i>
            </button>

            <button onclick="goToAdmin()"
                class="hidden md:flex bg-[#2b1b17] text-[var(--gold)] w-10 h-10 rounded-full shadow-lg border border-[var(--gold)] items-center justify-center active:scale-95 transition-all"
                title="Administración">
                <i class="fas fa-cog"></i>
            </button>

            <button onclick="logout()"
                class="bg-white/80 backdrop-blur-md text-[var(--gryffindor-red)] w-10 h-10 rounded-full shadow-lg border border-[var(--gold)] flex items-center justify-center active:scale-95 transition-all"
                title="Cerrar Sesión">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div id="trip-selection-container" style="display: none;"
        class="fade-in h-full flex-col items-center justify-center mt-6 px-4 pb-10">
        <i class="fas fa-ticket-alt text-5xl text-[var(--gryffindor-red)] mb-4 filter drop-shadow-md"></i>
        <h2 class="text-3xl font-bold text-center magic-font mb-6 text-[var(--ink)]">Tus Expediciones</h2>

        <div class="parchment-box p-6 rounded-lg w-full max-w-sm text-center shadow-lg relative">
            <h3 class="font-bold text-[var(--ink)] mb-4 border-b border-[var(--gold)] pb-2">
                <i class="fas fa-map-marked-alt text-[var(--gryffindor-red)] mr-2"></i> Selecciona tu destino
            </h3>

            <div id="trip-list" class="flex flex-col gap-3 mb-2 min-h-[60px] justify-center"></div>

            <hr class="border-[var(--gold)]/50 my-5">

            <div id="new-trip-form" class="bg-white/40 p-4 rounded border border-[var(--gold)]/30 shadow-inner">
                <h3 class="font-bold text-xs text-[var(--gryffindor-red)] mb-3 uppercase tracking-widest">Nueva
                    Expedición</h3>
                <input type="text" id="new-trip-name" placeholder="Ej: Escocia 2026..."
                    class="w-full p-2 border-b-2 border-[var(--gold)] bg-transparent focus:outline-none focus:bg-white transition text-center mb-4 font-medium text-stone-700">
                <button onclick="createNewTrip()"
                    class="w-full bg-[var(--gryffindor-red)] text-white font-bold py-2.5 rounded shadow-md active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-plus-circle"></i> Crear Viaje
                </button>
            </div>
        </div>

        <button onclick="logout()"
            class="mt-8 text-[var(--gryffindor-red)] font-bold flex items-center gap-2 active:scale-95 transition bg-white/60 px-5 py-2.5 rounded-full border border-red-200 shadow-sm">
            <i class="fas fa-sign-out-alt"></i> Salir del Andén
        </button>
    </div>

    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-10 relative scroll-smooth overscroll-contain">
    </main>

    <div id="sidebar-overlay" onclick="toggleMenu()"
        class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-opacity opacity-0 duration-300">
    </div>

    <nav id="sidebar-nav"
        class="fixed top-0 left-0 h-full w-64 bg-[#2b1b17] border-r-2 border-[var(--gold)] z-[70] transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col pt-20 pb-6 px-4 gap-2 shadow-[4px_0_15px_rgba(0,0,0,0.5)] overflow-y-auto">

        <button onclick="renderHome(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-home">
            <i class="fas fa-hat-wizard text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Inicio</span>
        </button>

        <button onclick="renderItineraryList(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-itin">
            <i class="fas fa-scroll text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Diario de Viaje</span>
        </button>

        <button onclick="renderTransport(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-trans">
            <i class="fas fa-train-subway text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Transporte</span>
        </button>

        <button onclick="renderFood(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-food">
            <i class="fas fa-utensils text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Comedor Mágico</span>
        </button>

        <button onclick="renderGastos(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-gastos">
            <i class="fas fa-coins text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Gringotts</span>
        </button>

        <button onclick="renderExplorerPass(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-pass">
            <i class="fas fa-ticket-alt text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Pase de Explorador.</span>
        </button>

        <button onclick="renderExtras(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-extra">
            <i class="fas fa-bolt text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Sala de Menesteres</span>
        </button>

        <hr class="border-[var(--gold)]/30 my-2 mx-4">

        <button onclick="backToTrips(); toggleMenu()"
            class="nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-mis-viajes">
            <i class="fas fa-map-marked-alt text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Mis Viajes</span>
        </button>

        <button onclick="goToAdmin(); toggleMenu()"
            class="md:hidden nav-item flex items-center gap-4 p-3 rounded-lg text-gray-400 hover:bg-white/5 active:bg-white/10 transition-all text-left"
            id="nav-admin">
            <i class="fas fa-cog text-xl w-6 text-center"></i>
            <span class="text-base magic-font tracking-wide">Configuración</span>
        </button>
    </nav>
    <script type="module" src="js/public/app.js"></script>

</body>

</html>
