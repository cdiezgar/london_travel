<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Expedición a Londres 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; color: #1f2937; }
        .modal-active { overflow: hidden; }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-100 font-sans">

    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full shadow-lg z-20">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold flex items-center gap-2 text-yellow-500">
                <i class="fas fa-hat-wizard"></i> Admin Mágico
            </h1>
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-menu"></nav>
        <div class="p-4 border-t border-gray-700">
            <button onclick="logoutAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded transition">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative">
        <header class="bg-white shadow p-4 flex justify-between items-center z-10">
            <h2 id="view-title" class="text-2xl font-bold text-gray-800">Panel de Control</h2>
            <button id="btn-add" class="hidden bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow font-bold transition">
                <i class="fas fa-plus mr-2"></i> Nuevo Registro
            </button>
        </header>
        
        <div id="content-area" class="flex-1 overflow-auto p-6">
            <div id="loading" class="text-center py-10 text-gray-500 hidden">
                <i class="fas fa-spinner fa-spin text-4xl mb-3"></i>
                <p>Cargando datos mágicos...</p>
            </div>
            
            <div class="bg-white shadow rounded-lg overflow-x-auto">
                <table class="w-full text-left border-collapse hidden" id="data-table">
                    <thead id="table-head" class="bg-gray-50 text-gray-700 border-b"></thead>
                    <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="form-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg shrink-0">
                <h3 id="modal-title" class="text-lg font-bold">Editar Registro</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 flex flex-col gap-6">
                <form id="dynamic-form" class="space-y-4"></form>

                <div id="timeline-container" class="hidden border-t pt-4">
                    <h4 class="font-bold text-gray-800 mb-3 flex items-center gap-2 text-lg">
                        <i class="fas fa-clock text-yellow-500"></i> Actividades del Día
                    </h4>
                    <div id="timeline-content" class="bg-gray-50 p-4 rounded border">
                        </div>
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50 rounded-b-lg flex justify-end gap-3 shrink-0">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 font-bold">Cancelar</button>
                <button onclick="saveData()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold">Guardar Datos Principales</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
