<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - El Andén 9 ¾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Homemade+Apple&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .modal-active { overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--parchment); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gryffindor-red); }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-[var(--parchment)] text-[var(--ink)]" style="font-family: 'Crimson Text', serif;">

<div id="admin-overlay" onclick="toggleAdminMenu()" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"></div>

    <aside id="admin-sidebar" class="absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out w-64 bg-[#2b1b17] text-[#e2d1aa] flex flex-col h-full shadow-[4px_0_15px_rgba(0,0,0,0.5)] z-30 border-r-2 border-[var(--gold)]">
        <div class="p-6 border-b border-[var(--gold)]/30 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex flex-col items-center gap-2 text-[var(--gold)] magic-font mx-auto">
                <i class="fas fa-hat-wizard text-4xl mb-1"></i> Admin Mágico
            </h1>
            <button onclick="toggleAdminMenu()" class="md:hidden text-[var(--gold)] text-2xl"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-menu"></nav>
        <div class="p-4 border-t border-[var(--gold)]/30">
            <button onclick="goToApp()" class="w-full bg-[var(--gryffindor-red)] hover:bg-red-900 text-white py-2.5 rounded transition border border-[var(--gold)] shadow-md magic-font tracking-wider active:scale-95 my-5">
                <i class="fas fa-sign-out-alt"></i> Ir al viaje
            </button>            
            <button onclick="logoutAdmin()" class="w-full bg-[var(--gryffindor-red)] hover:bg-red-900 text-white py-2.5 rounded transition border border-[var(--gold)] shadow-md magic-font tracking-wider active:scale-95">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full overflow-hidden">
        <header class="bg-[#fffef0] shadow-md p-4 sm:p-5 flex justify-between items-center z-10 border-b border-[#e2d1aa]">
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminMenu()" class="md:hidden text-[var(--gryffindor-red)] text-2xl focus:outline-none">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 id="view-title" class="text-xl sm:text-3xl font-bold text-[var(--gryffindor-red)] magic-font tracking-wide">Panel</h2>
            </div>
            
            <button id="btn-add" class="hidden bg-[var(--gryffindor-red)] hover:bg-red-900 text-white px-3 sm:px-5 py-2 sm:py-2.5 rounded shadow-md font-bold transition border border-[var(--gold)] magic-font active:scale-95 text-sm sm:text-base">
                <i class="fas fa-wand-magic-sparkles sm:mr-2"></i> <span class="hidden sm:inline">Nuevo Registro</span>
            </button>
        </header>
        
        <div id="content-area" class="flex-1 overflow-auto p-6 relative">
            <div id="loading" class="text-center py-20 text-[var(--gold)] hidden flex flex-col items-center">
                <i class="fas fa-spinner fa-spin text-5xl mb-4"></i>
                <p class="magic-font text-xl text-[var(--gryffindor-red)] font-bold">Invocando datos...</p>
            </div>
            
            <div class="parchment-box rounded-lg overflow-x-auto p-2">
                <table class="w-full text-left border-collapse hidden" id="data-table">
                    <thead id="table-head" class="text-[var(--gryffindor-red)] border-b-2 border-[var(--gold)] magic-font text-sm tracking-wider"></thead>
                    <tbody id="table-body" class="divide-y divide-[#e2d1aa]/50 text-lg"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="form-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="parchment-box rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-5 border-b-2 border-[var(--gold)] flex justify-between items-center bg-[#fffef0] rounded-t-lg shrink-0">
                <h3 id="modal-title" class="text-2xl font-bold text-[var(--gryffindor-red)] magic-font">Editar Registro</h3>
                <button onclick="closeModal()" class="text-[var(--ink)] hover:text-[var(--gryffindor-red)] transition"><i class="fas fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 flex flex-col gap-6">
                <form id="dynamic-form" class="space-y-5"></form>

                <div id="timeline-container" class="hidden border-t-2 border-[var(--gold)]/30 pt-6 mt-2">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-[var(--gryffindor-red)] flex items-center gap-2 text-xl magic-font">
                            <i class="fas fa-scroll text-[var(--gold)]"></i> Actividades del Día
                        </h4>
                        <button onclick="openActivityModal()" class="btn-reveal">
                            <i class="fas fa-plus"></i> Nueva Actividad
                        </button>
                    </div>
                    <div id="timeline-content" class="bg-white/40 p-4 rounded-lg border border-[#e2d1aa]"></div>
                </div>

                <div id="restaurants-container" class="hidden border-t-2 border-[var(--gold)]/30 pt-6 mt-2">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-[var(--gryffindor-red)] flex items-center gap-2 text-xl magic-font">
                            <i class="fas fa-utensils text-[var(--gold)]"></i> Dónde comer hoy
                        </h4>
                        <button type="button" onclick="openRestaurantModal()" class="btn-reveal">
                            <i class="fas fa-plus"></i> Añadir Restaurante
                        </button>
                    </div>
                    <div id="restaurants-content" class="bg-white/40 p-4 rounded-lg border border-[#e2d1aa]"></div>
                </div>

                <div id="pass-activities-container" class="hidden border-t-2 border-[var(--gold)]/30 pt-6 mt-2">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-[var(--gryffindor-red)] flex items-center gap-2 text-xl magic-font">
                            <i class="fas fa-list-ol text-[var(--gold)]"></i> Actividades del Pase
                        </h4>
                        <button type="button" onclick="openPassActivityModal()" class="btn-reveal">
                            <i class="fas fa-plus"></i> Añadir Actividad
                        </button>
                    </div>
                    <div id="pass-activities-content" class="bg-white/40 p-4 rounded-lg border border-[#e2d1aa]"></div>
                </div>
                
            </div>

            <div class="mt-6 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                <button type="button" onclick="closeModal()" class="w-full sm:w-auto bg-stone-300 hover:bg-stone-400 text-stone-800 px-5 py-2.5 rounded font-bold transition">Cancelar</button>
                <button type="button" onclick="saveData()" class="w-full sm:w-auto bg-[var(--gryffindor-red)] hover:bg-red-900 text-white px-5 py-2.5 rounded shadow-md font-bold transition border border-[var(--gold)] magic-font tracking-wider">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="activity-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="parchment-box rounded-lg shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col border-2 border-[var(--gold)]">
            <div class="p-5 border-b-2 border-[var(--gold)] flex justify-between items-center bg-[#fffef0] rounded-t-lg shrink-0">
                <h3 id="activity-modal-title" class="text-xl font-bold text-[var(--gryffindor-red)] magic-font"><i class="fas fa-wand-sparkles text-[var(--gold)]"></i> Configurar Actividad</h3>
                <button onclick="closeActivityModal()" class="text-[var(--ink)] hover:text-[var(--gryffindor-red)] transition"><i class="fas fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="activity-form" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-[#e2d1aa] pb-5">
                        <div class="col-span-1">
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Hora <span class="text-red-500">*</span></label>
                            <input type="time" id="act-hora" required class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-lg font-bold font-sans">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Nombre <span class="text-red-500">*</span></label>
                            <input type="text" id="act-nombre" required class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-lg" placeholder="Ej: Tower of London">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Tipo de icono</label>
                            <select id="act-tipo" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-base">
                                <option value="visita">Ojo (Visita)</option>
                                <option value="transporte">Tren (Transporte)</option>
                                <option value="comida">Cubiertos (Comida)</option>
                                <option value="museo">Columnas (Museo)</option>
                                <option value="caminar">Persona (Caminar)</option>
                                <option value="relax">Hoja (Relax/Parque)</option>
                                <option value="check">Check (Gestión)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Precio</label>
                            <input type="text" id="act-precio" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-base" placeholder="Ej: £15 o Pase">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Dirección / Maps</label>
                        <input type="text" id="act-direccion" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-base" placeholder="Ej: Westminster Abbey London">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font"><i class="fas fa-list-check text-[var(--gold)]"></i> Vincular a Checklist</label>
                        <select id="act-checklist" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none focus:bg-white transition text-base">
                            <option value="">-- Sin vincular --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Descripción Breve</label>
                        <textarea id="act-desc" rows="2" class="w-full p-2 border-2 border-[var(--gold)]/50 rounded bg-white/50 focus:outline-none focus:bg-white transition text-base"></textarea>
                    </div>

                    <div class="bg-[#fffef0] p-4 rounded border border-[var(--gold)] shadow-inner relative mt-6">
                        <div class="absolute -top-3 left-3 bg-[var(--parchment)] px-2">
                            <label class="text-sm font-bold text-yellow-700 magic-font tracking-wider"><i class="fas fa-star text-[var(--gold)]"></i> Archivo Secreto</label>
                        </div>                     
                        <textarea id="act-contexto" rows="3" class="w-full p-2 border-0 bg-transparent focus:outline-none focus:ring-0 text-base mt-2" placeholder="Historia mágica para el botón 'Revelar Secretos'..."></textarea>
                    </div>
                </form>

                <div id="activity-items-wrapper" class="hidden mt-6 border-t border-[#e2d1aa] pt-5">
                    <h4 class="font-bold text-[var(--gryffindor-red)] flex items-center gap-2 text-lg magic-font mb-3">
                        <i class="fas fa-eye text-[var(--gold)]"></i> Lo que no te puedes perder
                    </h4>
                    
                    <div id="activity-items-list" class="space-y-2 mb-3">
                        </div>
                    
                    <div class="flex flex-col gap-2 mt-3 bg-white/50 p-3 rounded border border-[var(--gold)]">
                        <input type="text" id="new-item-text" class="w-full p-2 border-b-2 border-[var(--gold)] bg-transparent focus:outline-none transition text-base font-bold text-[var(--ink)]" placeholder="Añadir algo para ver (Ej: Piedra Rosetta) *Obligatorio">
                        
                        <textarea id="new-item-desc" rows="2" class="w-full p-2 border-b-2 border-[var(--gold)] bg-transparent focus:outline-none transition text-sm text-stone-700" placeholder="Explicación detallada (Opcional)"></textarea>
                        
                        <input type="text" id="new-item-img" class="w-full p-2 border-b-2 border-[var(--gold)] bg-transparent focus:outline-none transition text-sm text-stone-700" placeholder="URL de la imagen representativa (Opcional)">
                        
                        <button type="button" id="btn-save-item" onclick="addActivityItem()" class="mt-2 bg-[var(--gold)] text-[var(--ink)] px-4 py-2 rounded font-bold shadow-sm hover:bg-yellow-600 transition border border-yellow-700 active:scale-95 w-full">
                            <i class="fas fa-plus"></i> Añadir Elemento
                        </button>
                    </div>
                </div>
                
                <div id="activity-items-warning" class="mt-6 border-t border-[#e2d1aa] pt-5 text-center hidden">
                    <p class="text-sm italic text-stone-600 font-bold"><i class="fas fa-lock text-[var(--gold)] mr-1"></i> Guarda esta actividad por primera vez para desbloquear la lista de cosas que ver.</p>
                </div>
            </div>

            <div class="mt-6 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                <button type="button" onclick="closeActivityModal()" class="w-full sm:w-auto bg-stone-300 hover:bg-stone-400 text-stone-800 px-5 py-2.5 rounded font-bold transition">Cancelar</button>
                <button type="button" onclick="saveActivity()" class="w-full sm:w-auto bg-[var(--gryffindor-red)] hover:bg-red-900 text-white px-5 py-2.5 rounded shadow-md font-bold transition border border-[var(--gold)] magic-font">Guardar Actividad</button>
            </div>
        </div>
    </div>

    <div id="restaurant-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div class="parchment-box rounded-lg shadow-2xl w-full max-w-lg flex flex-col border-2 border-[var(--gold)]">
            <div class="p-5 border-b-2 border-[var(--gold)] flex justify-between items-center bg-[#fffef0] rounded-t-lg shrink-0">
                <h3 id="restaurant-modal-title" class="text-xl font-bold text-[var(--gryffindor-red)] magic-font"><i class="fas fa-utensils text-[var(--gold)]"></i> Restaurante del Día</h3>
                <button onclick="closeRestaurantModal()" class="text-[var(--ink)] hover:text-[var(--gryffindor-red)] transition"><i class="fas fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="restaurant-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Nombre <span class="text-red-500">*</span></label>
                        <input type="text" id="rest-nombre" required class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-lg" placeholder="Ej: Padella">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Descripción Breve</label>
                        <input type="text" id="rest-desc" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: Pasta fresca increíble (cola virtual).">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Precio</label>
                            <input type="text" id="rest-precio" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: £10-14">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Localización / Maps</label>
                            <input type="text" id="rest-loc" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: Borough Market">
                        </div>
                    </div>
                </form>
            </div>

            <div class="mt-6 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                <button type="button" onclick="closeRestaurantModal()" class="w-full sm:w-auto bg-stone-300 hover:bg-stone-400 text-stone-800 px-5 py-2.5 rounded font-bold transition">Cancelar</button>
                <button type="button" onclick="saveRestaurant()" class="w-full sm:w-auto bg-[var(--gryffindor-red)] hover:bg-red-900 text-white px-5 py-2.5 rounded shadow-md font-bold transition border border-[var(--gold)] magic-font">Guardar Restaurante</button>
            </div>
        </div>
    </div>

    <div id="pass-activity-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div class="parchment-box rounded-lg shadow-2xl w-full max-w-lg flex flex-col border-2 border-[var(--gold)]">
            <div class="p-5 border-b-2 border-[var(--gold)] flex justify-between items-center bg-[#fffef0] rounded-t-lg shrink-0">
                <h3 id="pass-activity-modal-title" class="text-xl font-bold text-[var(--gryffindor-red)] magic-font"><i class="fas fa-ticket-alt text-[var(--gold)]"></i> Actividad del Pase</h3>
                <button onclick="closePassActivityModal()" class="text-[var(--ink)] hover:text-[var(--gryffindor-red)] transition"><i class="fas fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="pass-activity-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Nombre de Atracción <span class="text-red-500">*</span></label>
                        <input type="text" id="pass-act-nombre" required class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-lg" placeholder="Ej: Tower of London">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Precio Taquilla</label>
                            <input type="number" step="0.01" id="pass-act-precio" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: 34.80">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Día Sugerido</label>
                            <input type="text" id="pass-act-dia" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: Día 4">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-[var(--gryffindor-red)] mb-1 magic-font">Icono (FontAwesome)</label>
                        <input type="text" id="pass-act-icono" class="w-full p-2 border-b-2 border-[var(--gold)] bg-white/50 focus:outline-none transition text-base" placeholder="Ej: fa-chess-rook">
                    </div>
                </form>
            </div>

            <div class="mt-6 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                <button type="button" onclick="closePassActivityModal()" class="w-full sm:w-auto bg-stone-300 hover:bg-stone-400 text-stone-800 px-5 py-2.5 rounded font-bold transition">Cancelar</button>
                <button type="button" onclick="savePassActivity()" class="w-full sm:w-auto bg-[var(--gryffindor-red)] hover:bg-red-900 text-white px-5 py-2.5 rounded shadow-md font-bold transition border border-[var(--gold)] magic-font">Guardar Actividad</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
